name: CI

# Run the offline test suite on every push and pull request.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run the offline test suite with coverage
        # The whole suite is offline/deterministic — no network, no broker, no live
        # Sharadar calls (SharadarUnavailable/cache-miss paths are what's tested).
        run: |
          pytest \
            --cov=data --cov=factors --cov=research --cov=strategies \
            --cov=backtest --cov=decision --cov=execution --cov=storage \
            --cov-report=term-missing
